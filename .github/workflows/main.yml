name: Windows VPS RDP

on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'Ngrok Auth Token'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set User Password
        run: |
          $Password = ConvertTo-SecureString "Admin123456!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Download & Install Ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/b3M4120Jfx1/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .

      - name: Configure & Start Ngrok
        run: |
          $token = "${{ github.event.inputs.ngrok_token }}"
          if (-not $token) {
            $token = "${{ secrets.NGROK_AUTH_TOKEN }}"
          }
          .\ngrok.exe config add-authtoken $token
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"

      - name: Show Connection Info
        run: |
          Start-Sleep -Seconds 5
          try {
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
            $url = $response.tunnels[0].public_url -replace 'tcp://', ''
            Write-Host "=========================================="
            Write-Host "Address  : $url"
            Write-Host "Username : runneradmin"
            Write-Host "Password : Admin123456!"
            Write-Host "=========================================="
          } catch {
            Write-Host "Ngrok berhasil berjalan, silakan cek URL tunneling di dashboard ngrok.com"
          }

      - name: Keep Alive Workflow
        run: |
          $i = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $i++
            Write-Host "VPS Active - $i min"
          }
