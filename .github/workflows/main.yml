name: Windows VPS RDP (Ngrok)

on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'Masukkan Auth Token Ngrok Kamu'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set User Password
        run: |
          $Password = ConvertTo-SecureString "Admin123456!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Setup and Start Ngrok
        run: |
          choco install ngrok
          ngrok config add-authtoken "${{ github.event.inputs.ngrok_token }}"
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep -Seconds 6

          try {
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
            $url = $response.tunnels[0].public_url -replace "tcp://", ""
            Write-Host "=========================================="
            Write-Host " Address RDP : $url"
            Write-Host " Username    : runneradmin"
            Write-Host " Password    : Admin123456!"
            Write-Host "=========================================="
          } catch {
            Write-Host "Gagal mengambil URL Ngrok. Pastikan Auth Token kamu benar."
          }

      - name: Keep VPS Active
        run: |
          $cnt = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $cnt++
            Write-Host "VPS Active - $cnt min"
          }
