name: Windows VPS RDP

on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'Ngrok Auth Token'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set User Password
        run: |
          $Password = ConvertTo-SecureString "Admin123456!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Download & Install Ngrok
        run: |
          choco install ngrok -y

      - name: Start Ngrok & Keep Alive
        run: |
          $token = "${{ github.event.inputs.ngrok_token }}"
          if (-not $token) {
            $token = "${{ secrets.NGROK_AUTH_TOKEN }}"
          }

          if (-not $token) {
            Write-Host "ERROR: Ngrok Auth Token tidak ditemukan!"
            exit 1
          }

          ngrok config add-authtoken $token

          # Jalankan Ngrok sebagai proses latar belakang yang stabil
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389" -WindowStyle Hidden

          # Coba mengambil URL tunnel sebanyak 10 kali
          $url = ""
          for ($i = 1; $i -le 10; $i++) {
            Start-Sleep -Seconds 3
            try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
              if ($response.tunnels.Length -gt 0) {
                $url = $response.tunnels[0].public_url -replace 'tcp://', ''
                break
              }
            } catch {}
          }

          Write-Host "=========================================="
          if ($url) {
            Write-Host "Address  : $url"
            Write-Host "Username : runneradmin"
            Write-Host "Password : Admin123456!"
          } else {
            Write-Host "Gagal mendapatkan URL dari Ngrok."
            Write-Host "Pastikan Auth Token benar dan email akun Ngrok sudah terverifikasi."
          }
          Write-Host "=========================================="

          # Menjaga workflow tetap aktif
          $cnt = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $cnt++
            Write-Host "VPS Active - $cnt min"
          }
