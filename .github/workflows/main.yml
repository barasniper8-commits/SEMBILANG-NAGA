name: Windows VPS RDP

on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'Ngrok Auth Token'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set User Password
        run: |
          $Password = ConvertTo-SecureString "Admin123456!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Download & Install Ngrok
        run: |
          choco install ngrok -y

      - name: Start Ngrok & Keep Alive
        run: |
          $token = "${{ github.event.inputs.ngrok_token }}"
          if (-not $token) {
            $token = "${{ secrets.NGROK_AUTH_TOKEN }}"
          }
          
          if (-not $token) {
            Write-Host "ERROR: Ngrok Auth Token tidak ditemukan!"
            exit 1
          }

          ngrok config add-authtoken $token
          
          # Jalankan Ngrok dalam job terpisah di langkah yang sama
          $ngrokJob = Start-Job -ScriptBlock { ngrok tcp 3389 }
          
          Start-Sleep -Seconds 7

          # Mengambil IP dan Port langsung dari API lokal Ngrok
          try {
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
            $url = $response.tunnels[0].public_url -replace 'tcp://', ''
            Write-Host "=========================================="
            Write-Host "Address  : $url"
            Write-Host "Username : runneradmin"
            Write-Host "Password : Admin123456!"
            Write-Host "=========================================="
          } catch {
            Write-Host "Gagal mendapatkan URL. Pastikan Ngrok Auth Token valid."
          }

          # Menjaga workflow tetap berjalan
          $i = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $i++
            Write-Host "VPS Active - $i min"
          }
