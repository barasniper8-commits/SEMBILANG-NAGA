name: Windows RDP Tailscale

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Masukkan Tailscale Authkey (tskey-auth-...)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Mengambil Kredensial dari Lynk.id
        id: get_creds
        shell: pwsh
        run: |
          $url = "https://arianto12.lynk.id/p/ganjay"
          
          try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing
              # Mengambil teks dari halaman, sesuaikan pola regex jika diperlukan
              if ($response.Content -match 'USER:(?<user>\S+)\s+PASS:(?<pass>\S+)') {
                  $username = $matches['user']
                  $password = $matches['pass']
              } else {
                  # Fallback jika format tidak ditemukan di halaman
                  $username = "AriantoRDP"
                  $password = "Password123!"
              }
          } catch {
              $username = "AriantoRDP"
              $password = "Password123!"
          }

          echo "USERNAME=$username" >> $env:GITHUB_OUTPUT
          echo "::add-mask::$password"

          # Membuat user baru dan memasukkannya ke grup Administrator
          net user $username $password /add
          net localgroup administrators $username /add
          
          Write-Host "RDP User berhasil diset: $username"

      - name: Mengaktifkan RDP (Remote Desktop)
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Instal & Konfigurasi Tailscale
        shell: pwsh
        run: |
          winget install Tailscale.Tailscale --silent --accept-package-agreements --accept-source-agreements
          Start-Sleep -s 5
          
          # Join ke network Tailscale menggunakan authkey dari input manual saat run workflow
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ github.event.inputs.tailscale_authkey }}" --unattended
          
          Write-Host "Tailscale berhasil terhubung!"

      - name: Informasi Akses RDP
        shell: pwsh
        run: |
          $ip = (Test-Connection -ComputerName (hostname) -Count 1).IPV4Address.IPAddressToString
          $tsIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host "=================================================="
          Write-Host "RDP Siap Digunakan!"
          Write-Host "IP Tailscale (Gunakan ini di Windows App): $tsIp"
          Write-Host "Username: ${{ steps.get_creds.outputs.USERNAME }}"
          Write-Host "=================================================="

      - name: Menjaga RDP Tetap Hidup
        shell: pwsh
        run: |
          Write-Host "RDP sedang berjalan. Biarkan tab ini terbuka."
          while ($true) { Start-Sleep -s 30 }
