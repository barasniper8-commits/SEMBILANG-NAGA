name: Windows VPS RDP (Pinggy)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set User Password
        run: |
          $Password = ConvertTo-SecureString "Admin123456!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Start Pinggy Tunnel & Display IP
        run: |
          # Ambil IP Publik Runner
          try {
            $runnerIp = (Invoke-RestMethod -Uri "https://api.ipify.org")
          } catch {
            $runnerIp = "Gagal mengambil IP"
          }

          # Jalankan SSH Pinggy di latar belakang
          $logPath = "$PWD\pinggy.log"
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 a.pinggy.io > `"$logPath`" 2>&1" -WindowStyle Hidden

          # Tunggu koneksi terbentuk
          Start-Sleep -Seconds 12

          # Fungsi khusus membaca file log yang terkunci
          function Get-LockedContent ($filePath) {
            if (-not (Test-Path $filePath)) { return "" }
            try {
              $fileStream = [System.IO.FileStream]::new($filePath, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
              $streamReader = [System.IO.StreamReader]::new($fileStream)
              $content =$streamReader.ReadToEnd()
              $streamReader.Close()$fileStream.Close()
              return $content
            } catch {
              return ""
            }
          }

          # Ekstrak Alamat RDP
          $logText = Get-LockedContent $logPath$address = ""
          if ($logText -match 'tcp://([a-zA-Z0-9\.\-]+:[0-9]+)') {$address = $matches[1]           } elseif ($logText -match '([a-zA-Z0-9\.\-]+\.pinggy\.[a-z]+:[0-9]+)') {
            $address =$matches[1]
          }

          Write-Host "=========================================="
          Write-Host " IP Publik Runner : $runnerIp"
          if ($address) {
            Write-Host " Address RDP      : $address"
            Write-Host " Username         : runneradmin"
            Write-Host " Password         : Admin123456!"
          } else {
            Write-Host " Address RDP      : Memproses log..."
            Write-Host "------------------------------------------"
            Write-Host "ISI LOG PINGGY:"
            Write-Host $logText
          }
          Write-Host "=========================================="

          # Menjaga Workflow Tetap Aktif & Pindai Ulang Log
          $cnt = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $cnt++
            Write-Host "VPS Active - $cnt min"
            if (-not $address) {
              $currentLog = Get-LockedContent$logPath
              if ($currentLog -match 'tcp://([a-zA-Z0-9\.\-]+:[0-9]+)') {
                $address =$matches[1]
                Write-Host ">>> ADDRESS RDP: $address <<<"
              } elseif ($currentLog -match '([a-zA-Z0-9\.\-]+\.pinggy\.[a-z]+:[0-9]+)') {
                $address =$matches[1]
                Write-Host ">>> ADDRESS RDP: $address <<<"
              }
            }
          }
