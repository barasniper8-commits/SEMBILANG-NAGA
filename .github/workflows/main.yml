name: Windows VPS RDP (Pinggy)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set User Password
        run: |
          $Password = ConvertTo-SecureString "Admin123456!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Start Pinggy Tunnel & Display IP
        run: |
          # Ambil IP Publik Runner
          try {
            $runnerIp = (Invoke-RestMethod -Uri "https://api.ipify.org")
          } catch {
            $runnerIp = "Gagal mengambil IP"
          }

          # Jalankan SSH Tunneling Pinggy
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 qr@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log" -WindowStyle Hidden

          Start-Sleep -Seconds 10

          # Cari alamat RDP dari output log
          $address = ""
          if (Test-Path "pinggy.log") {
            $logContent = Get-Content "pinggy.log" -Raw
            if ($logContent -match 'tcp://([a-zA-Z0-9\.\-]+:[0-9]+)') {
              $address = $matches[1]
            }
          }

          Write-Host "=========================================="
          Write-Host " IP Publik Runner : $runnerIp"
          if ($address) {
            Write-Host " Address RDP      : $address"
            Write-Host " Username         : runneradmin"
            Write-Host " Password         : Admin123456!"
          } else {
            Write-Host " Address RDP      : Memproses koneksi..."
            Write-Host "------------------------------------------"
            if (Test-Path "pinggy.log") { Get-Content "pinggy.log" }
          }
          Write-Host "=========================================="

          # Menjaga Workflow Tetap Aktif
          $cnt = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $cnt++
            Write-Host "VPS Active - $cnt min"
          }
