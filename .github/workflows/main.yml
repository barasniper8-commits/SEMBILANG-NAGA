name: RDP Tailscale

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale Auth Key (tskey-auth-...)"
        required: true
      rdp_user:
        description: "Username RDP"
        required: true
        default: "rdpuser"
      rdp_pass:
        description: "Password RDP"
        required: true
      durasi_menit:
        description: "Durasi aktif (menit, max 350)"
        required: true
        default: "120"

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      RDP_USER: ${{ inputs.rdp_user }}
      RDP_PASS: ${{ inputs.rdp_pass }}
      DURASI: ${{ inputs.durasi_menit }}
    steps:
      - name: Sembunyikan password di log
        shell: pwsh
        run: Write-Host "::add-mask::$env:RDP_PASS"

      - name: Install & connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ inputs.ts_authkey }}
          hostname: github-rdp

      - name: Aktifkan RDP & buat user
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1

          $pw = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $pw -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER

      - name: Tampilkan IP Tailscale & tahan sesi
        shell: pwsh
        run: |
          $ip = (tailscale ip -4).Trim()
          Write-Host "=============================="
          Write-Host "RDP ke: $ip  (user: $env:RDP_USER)"
          Write-Host "=============================="
          $end = (Get-Date).AddMinutes([int]$env:DURASI)
          while ((Get-Date) -lt $end) { Start-Sleep -Seconds 30 }
