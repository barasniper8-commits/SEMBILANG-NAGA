name: Windows VPS RDP (Serveo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set User Password
        run: |
          $Password = ConvertTo-SecureString "Admin123456!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Start Serveo Tunnel (Auto Reconnect)
        run: |
          try {
            $runnerIp = (Invoke-RestMethod -Uri "https://api.ipify.org")
          } catch {
            $runnerIp = "Gagal mengambil IP"
          }

          Write-Host "=========================================="
          Write-Host " IP Publik Runner : $runnerIp"
          Write-Host " Username         : runneradmin"
          Write-Host " Password         : Admin123456!"
          Write-Host "=========================================="

          # Perulangan otomatis jika Serveo terputus karena idle
          while ($true) {
            Write-Host "------------------------------------------"
            Write-Host " Membuka koneksi Serveo..."
            Write-Host " Silakan lihat baris 'Forwarding TCP connections from' di bawah:"
            Write-Host "------------------------------------------"
            
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -R 0:localhost:3389 serveo.net
            
            Write-Host "Koneksi Serveo terputus. Mengubungkan ulang dalam 3 detik..."
            Start-Sleep -Seconds 3
          }
